name: Build WorktreeWise

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  issues: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Package Linux application
        run: npm run package:linux

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorktreeWise-linux-latest
          path: release/build/*

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Package macOS application
        run: npm run package:macos

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorktreeWise-macos-latest
          path: release/build/*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Package Windows application
        run: npm run package:win

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorktreeWise-windows-latest
          path: release/build/*
