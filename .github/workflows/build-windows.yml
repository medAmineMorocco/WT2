name: Build WorktreeWise on Windows

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  issues: write

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: ia32
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Package Windows application
        run: npm run package:target -- win ${{ matrix.arch }}

      - name: Upload GitHub Actions installer
        uses: actions/upload-artifact@v4
        with:
          name: WorktreeWise-windows-${{ matrix.arch }}
          path: release/build/*.exe
          if-no-files-found: error

      - name: Upload to GoFile
        shell: bash
        run: |
          for file in release/build/*.exe; do
            [ -e "$file" ] || continue
            echo "Uploading $file..."
            curl -F "file=@$file" https://store1.gofile.io/uploadFile
          done
