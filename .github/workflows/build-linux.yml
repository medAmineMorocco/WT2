name: Build WorktreeWise on Linux

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  issues: write

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install native ARM64 Linux packaging tools
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ruby ruby-dev rpm
          sudo gem install fpm --no-document
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      - name: Package Linux application
        run: npm run package:target -- linux ${{ matrix.arch }}

      - name: Upload GitHub Actions installers
        uses: actions/upload-artifact@v4
        with:
          name: WorktreeWise-linux-${{ matrix.arch }}
          path: |
            release/build/*.deb
            release/build/*.rpm
          if-no-files-found: error

      - name: Upload to GoFile
        run: |
          for file in release/build/*.deb release/build/*.rpm; do
            [ -e "$file" ] || continue
            echo "Uploading $file..."
            curl -F "file=@$file" https://store1.gofile.io/uploadFile
          done
