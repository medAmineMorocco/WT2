name: Build WorktreeWise on Linux

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  issues: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Linux application
        run: npm run package:linux

      - name: Upload to GoFile
        run: |
          for file in release/build/*.deb release/build/*.rpm; do
            [ -e "$file" ] || continue
            echo "Uploading $file..."
            curl -F "file=@$file" https://store1.gofile.io/uploadFile
          done
